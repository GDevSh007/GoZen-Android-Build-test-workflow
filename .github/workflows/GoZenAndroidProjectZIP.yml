name: Remote Build GoZen Android Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-project-zip:
    name: Build GoZen Android Project ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout GoZen
        uses: actions/checkout@v4
        with:
          repository: VoylinsGamedevJourney/gozen
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Toolchain
      # ------------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android packages
        run: |
          sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;23.2.8568313" \
            "cmake;3.22.1"

      - name: Setup Python + SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SCons
        run: pip install scons

      # ------------------------------------------------------------------
      # 3. Cache heavy native builds (v9 forces static FFmpeg rebuild)
      # ------------------------------------------------------------------
      - name: Cache codec prefix + FFmpeg
        id: cache-codecs
        uses: actions/cache@v4
        with:
          path: |
            codec_prefix
            core/ffmpeg
            core/gde_gozen/ffmpeg
          key: codecs-arm64-ndk23-godotcpp43-${{ hashFiles('core/SConstruct', '.github/workflows/*.yml') }}-v11

      # ------------------------------------------------------------------
      # 4. Prepare native deps + godot-cpp 4.3 Stable
      # ------------------------------------------------------------------
      - name: Clone required libraries + godot-cpp
        run: |
          set -euo pipefail
          cd ./core

          GDE_DIR="gde_gozen"

          if [ ! -d "$GDE_DIR/libvpx" ]; then
            git clone --depth 1 https://chromium.googlesource.com/webm/libvpx "$GDE_DIR/libvpx"
          fi

          if [ ! -d "$GDE_DIR/libaom" ]; then
            git clone --depth 1 https://aomedia.googlesource.com/aom "$GDE_DIR/libaom"
          fi

          if [ ! -d "$GDE_DIR/ffmpeg" ]; then
            git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg.git "$GDE_DIR/ffmpeg"
          fi

          rm -rf godot_cpp godot-cpp
          git clone --depth 1 -b godot-4.3-stable https://github.com/godotengine/godot-cpp.git godot_cpp
          cd godot_cpp
          git submodule update --init --recursive

      # ------------------------------------------------------------------
      # 5. Build external codecs (OpenSSL, VPX, AOM)
      # ------------------------------------------------------------------
      - name: Build External Codecs (OpenSSL, VPX, AOM)
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/codec_prefix"
          mkdir -p "$PREFIX"

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/23.2.8568313"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android24-clang
          export CXX=aarch64-linux-android24-clang++

          # OpenSSL
          git clone --depth 1 -b openssl-3.0.12 https://github.com/openssl/openssl.git
          cd openssl
          ./Configure android-arm64 -D__ANDROID_API__=24 --prefix="$PREFIX" no-shared
          make -j$(nproc)
          make install_sw
          cd "$GITHUB_WORKSPACE"

          # libvpx
          cd ./core/gde_gozen/libvpx
          ./configure \
            --target=arm64-android-gcc \
            --prefix="$PREFIX" \
            --disable-examples --disable-tools --disable-docs \
            --enable-pic --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

          # libaom
          cd ./core/gde_gozen/libaom
          mkdir -p build_android && cd build_android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTS=0 -DENABLE_TOOLS=0 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          make install

      # ------------------------------------------------------------------
      # 6. Cross-compile FFmpeg (Static Integration)
      # ------------------------------------------------------------------
      - name: Cross-Compile FFmpeg (arm64)
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd ./core/gde_gozen/ffmpeg
          PREFIX="$GITHUB_WORKSPACE/codec_prefix"
          
          NDK_PATH="$ANDROID_HOME/ndk/23.2.8568313"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          API=24

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android$API-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android$API-clang++ \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --sysroot=$TOOLCHAIN/sysroot \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -fPIC" \
            --extra-libs="-lm -lz" \
            --prefix="$PREFIX" \
            --disable-programs \
            --disable-doc \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --enable-libvpx \
            --enable-libaom \
            --enable-openssl \
            --enable-protocol=https \
            --enable-protocol=tls


          make -j$(nproc)
          make install

      # ------------------------------------------------------------------
      # 7. Patch Upstream C++ Code
      # ------------------------------------------------------------------
      - name: Patch Upstream C++ Code
        run: |
          set -euo pipefail
          cd core/gde_gozen
          
          python3 << 'EOF'
          import os
          import re

          # 1. Patch Math_PI
          f_math = "smb_pitch_shift.hpp"
          if os.path.exists(f_math):
              with open(f_math, "r") as f: content = f.read()
              if "Math_PI" not in content[:500]:
                  with open(f_math, "w") as f:
                      f.write("#ifndef Math_PI\n#define Math_PI 3.14159265358979323846\n#endif\n" + content)

          # 2. Patch audio_stream_ffmpeg.hpp
          f_hpp = "audio_stream_ffmpeg.hpp"
          if os.path.exists(f_hpp):
              with open(f_hpp, "r") as f: content = f.read()
              if "<godot_cpp/classes/audio_stream.hpp>" not in content:
                  content = content.replace("#include <godot_cpp/classes/audio_stream_playback.hpp>", 
                                            "#include <godot_cpp/classes/audio_stream.hpp>\n#include <godot_cpp/classes/mutex.hpp>\n#include <godot_cpp/classes/audio_stream_playback.hpp>")
              if "friend class AudioStreamFFmpeg;" not in content:
                  content = content.replace("class AudioStreamFFmpegPlayback : public godot::AudioStreamPlayback {", 
                                            "class AudioStreamFFmpegPlayback : public godot::AudioStreamPlayback {\n    friend class AudioStreamFFmpeg;\n")
              content = content.replace("Mutex* mutex", "godot::Mutex* mutex")
              content = content.replace("float _get_stream_sampling_rate() const override", "double _get_stream_sampling_rate() const override")
              with open(f_hpp, "w") as f: f.write(content)

          # 3. Patch audio_stream_ffmpeg.cpp
          f_cpp = "audio_stream_ffmpeg.cpp"
          if os.path.exists(f_cpp):
              with open(f_cpp, "r") as f: content = f.read()
              content = content.replace("memnew(Mutex)", "memnew(godot::Mutex)")
              with open(f_cpp, "w") as f: f.write(content)

          # 4. Patch video.cpp (Dictionary set to bracket operator)
          f_vid = "video.cpp"
          if os.path.exists(f_vid):
              with open(f_vid, "r") as f: content = f.read()
              content = re.sub(r'dict\.set\(\s*(.*?)\s*,\s*(.*?)\s*\);', r'dict[\1] = \2;', content)
              with open(f_vid, "w") as f: f.write(content)
          EOF

      # ------------------------------------------------------------------
      # 8. Compile GDExtension
      # ------------------------------------------------------------------
      - name: Compile GDExtension (arm64)
        run: |
          set -euo pipefail
          cd ./core

          if [ ! -f "$GITHUB_WORKSPACE/codec_prefix/include/libavcodec/avcodec.h" ]; then
            echo "ERROR: FFmpeg headers not found in codec_prefix"
            exit 1
          fi

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/23.2.8568313"

          python3 << 'EOF'
          import os
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          prefix_lib = os.path.join(workspace, "codec_prefix", "lib")
          prefix_inc = os.path.join(workspace, "codec_prefix", "include")

          with open("SConstruct", "r") as f: lines = f.readlines()
          with open("SConstruct", "w") as f:
              for line in lines:
                  for bad in ['"tls"', "'tls'"]:
                      line = line.replace(bad + ",", "").replace(", " + bad, "").replace(bad, '""')
                  if "env.SharedLibrary" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      f.write(f'{indent}env.Append(CPPPATH=["gde_gozen", "{prefix_inc}"])\n')
                      f.write(f'{indent}env.Append(CXXFLAGS=["-Igde_gozen", "-I{prefix_inc}"])\n')
                      f.write(f'{indent}env.Append(LIBPATH=["{prefix_lib}"])\n')
                      f.write(f'{indent}env.Append(LIBS=["avformat", "avcodec", "avutil", "swscale", "swresample", "vpx", "aom", "ssl", "crypto", "z"])\n')
                  f.write(line)
          EOF

          scons platform=android target=template_release arch=arm64 -j$(nproc)
          scons platform=android target=template_debug   arch=arm64 -j$(nproc)

      # ------------------------------------------------------------------
      # 9. Patch GDExtension & Copy Binaries
      # ------------------------------------------------------------------
      - name: Patch GDExtension & copy binaries
        run: |
          set -euo pipefail
          
          # 1. Find main .gdextension file
          EXT_FILE=$(find . -name "*.gdextension" -not -path "*/godot_cpp/*" | head -n1)
          if [ -z "$EXT_FILE" ]; then
            echo "ERROR: Could not find the main .gdextension file"
            exit 1
          fi
          EXT_DIR=$(dirname "$EXT_FILE")
          
          # 2. Find compiled libraries
          DEBUG_SO=$(find . -name "*template_debug.arm64.so" | head -n1)
          RELEASE_SO=$(find . -name "*template_release.arm64.so" | head -n1)
          
          if [ -z "$DEBUG_SO" ] || [ -z "$RELEASE_SO" ]; then
            echo "ERROR: Could not find the compiled .so files!"
            exit 1
          fi
          
          export DEBUG_NAME=$(basename "$DEBUG_SO")
          export RELEASE_NAME=$(basename "$RELEASE_SO")
          export EXT_FILE
          export RES_PREFIX="res://bin"
          
          # 3. Create bin folder directly next to the .gdextension and copy files
          mkdir -p "$EXT_DIR/bin"
          cp "$DEBUG_SO" "$EXT_DIR/bin/"
          cp "$RELEASE_SO" "$EXT_DIR/bin/"
          
          # 4. Inject 4.3 compatibility and exact Android paths
          python3 << 'EOF'
          import os
          import re
          
          path = os.environ['EXT_FILE']
          res_prefix = os.environ['RES_PREFIX']
          debug_name = os.environ['DEBUG_NAME']
          release_name = os.environ['RELEASE_NAME']
          
          with open(path) as f: content = f.read()
          
          # Strip old android entries if they exist
          content = re.sub(r'android\.(debug|release)\.arm64\s*=.*\n?', '', content)
          
          # Force compatibility to 4.3 for newer Godot editors
          content = re.sub(r'compatibility_minimum\s*=\s*".*"', 'compatibility_minimum = "4.3"', content)
          
          libs = f"""[libraries]
          android.debug.arm64 = "{res_prefix}/{debug_name}"
          android.release.arm64 = "{res_prefix}/{release_name}"
          """
          
          if "[libraries]" in content:
              content = content.replace("[libraries]", libs.strip(), 1)
          else:
              content += "\n" + libs
              
          with open(path, "w") as f: f.write(content)
          EOF

      # ------------------------------------------------------------------
      # 10. Create project ZIP & Upload
      # ------------------------------------------------------------------
      - name: Create project ZIP
        run: |
          mkdir -p dist
          zip -r dist/GoZen-Android-Project.zip . \
            -x "*.git*" "*libvpx*" "*libaom*" "*ffmpeg*" "*godot_cpp*" "*codec_prefix*" "*openssl*" \
            -x "*build*" "*dist*" "*.o" "*.a" "*.obj" "*__pycache__*" "*.pyc" "*compile_commands.json*"

      - name: Upload Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-Android-Project
          path: dist/GoZen-Android-Project.zip
          retention-days: 14
