name: Remote Build GoZen Android Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-project-zip:
    name: Build GoZen Android Project ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout GoZen
        uses: actions/checkout@v4
        with:
          repository: VoylinsGamedevJourney/gozen
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Toolchain
      # ------------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android packages
        run: |
          sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1"

      - name: Setup Python + SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SCons
        run: pip install scons

      - name: Setup Godot 4.3 (only used for helper tools if needed)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      # ------------------------------------------------------------------
      # 3. Cache heavy native builds
      # ------------------------------------------------------------------
      - name: Cache codec prefix + FFmpeg
        id: cache-codecs
        uses: actions/cache@v4
        with:
          path: |
            codec_prefix
            core/gde_gozen/ffmpeg
          key: codecs-arm64-ndk28-godotcpp48-${{ hashFiles('core/gde_gozen/**/SConstruct', 'core/gde_gozen/**/*.cpp') }}-v3

      # ------------------------------------------------------------------
      # 4. Prepare native deps + godot-cpp 4.8
      # ------------------------------------------------------------------
      - name: Clone required libraries + godot-cpp 4.8
        run: |
          set -euo pipefail
          GDE_DIR="./core/gde_gozen"
          cd "$GDE_DIR"

          # libvpx
          if [ ! -d "libvpx" ]; then
            echo "Cloning libvpx..."
            git clone --depth 1 https://chromium.googlesource.com/webm/libvpx
          fi

          # libaom
          if [ ! -d "libaom" ]; then
            echo "Cloning libaom..."
            git clone --depth 1 https://aomedia.googlesource.com/aom libaom
          fi

          # FFmpeg
          if [ ! -d "ffmpeg" ]; then
            echo "Cloning FFmpeg n7.1..."
            git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg
          fi
          
          # Force latest godot-cpp (compatible with 4.8-dev7)
          # IMPORTANT: folder must be named "godot_cpp" (underscore)
          echo "Injecting godot-cpp master as godot_cpp..."
          rm -rf godot-cpp godot_cpp
          git clone --depth 1 -b master https://github.com/godotengine/godot-cpp.git godot_cpp
          cd godot_cpp
          git submodule update --init --recursive
          cd ..

          echo "Native deps + godot-cpp ready"
          ls -la

      # ------------------------------------------------------------------
      # 5. Build external codecs (OpenSSL, VPX, AOM)
      # ------------------------------------------------------------------
      - name: Build External Codecs (OpenSSL, VPX, AOM)
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          GDE_DIR="./core/gde_gozen"
          PREFIX="$GITHUB_WORKSPACE/codec_prefix"
          mkdir -p "$PREFIX"

          export ANDROID_NDK_ROOT="/usr/local/lib/android/sdk/ndk/28.1.13356709"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android24-clang
          export CXX=aarch64-linux-android24-clang++

          # ---------- OpenSSL ----------
          git clone --depth 1 -b openssl-3.0.12 https://github.com/openssl/openssl.git
          cd openssl
          ./Configure android-arm64 -D__ANDROID_API__=24 --prefix="$PREFIX" no-shared
          make -j$(nproc)
          make install_sw
          cd ..

          # ---------- libvpx ----------
          cd "$GDE_DIR/libvpx"
          ./configure \
            --target=arm64-android-gcc \
            --prefix="$PREFIX" \
            --disable-examples --disable-tools --disable-docs \
            --enable-pic --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

          # ---------- libaom ----------
          cd "$GDE_DIR/libaom"
          mkdir -p build_android && cd build_android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTS=0 -DENABLE_TOOLS=0 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------
      # 6. Cross-compile FFmpeg
      # ------------------------------------------------------------------
      - name: Cross-Compile FFmpeg (arm64)
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd ./core/gde_gozen/ffmpeg
          PREFIX="$GITHUB_WORKSPACE/codec_prefix"
          NDK_PATH="/usr/local/lib/android/sdk/ndk/28.1.13356709"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          API=24

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android$API-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android$API-clang++ \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --sysroot=$TOOLCHAIN/sysroot \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib" \
            --extra-libs="-lm -lz" \
            --prefix="$PREFIX" \
            --disable-programs \
            --disable-doc \
            --disable-static \
            --enable-shared \
            --enable-pic \
            --enable-libvpx \
            --enable-libaom \
            --enable-openssl \
            --enable-protocol=https \
            --enable-protocol=tls

          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------
      # 7. Compile GDExtension
      # ------------------------------------------------------------------
      - name: Compile GDExtension (arm64)
        run: |
          set -euo pipefail

          GDE_DIR="./core/gde_gozen"
          if [ ! -d "$GDE_DIR" ]; then
            echo "ERROR: $GDE_DIR does not exist"
            find . -maxdepth 3 -type d -name "*gozen*" || true
            exit 1
          fi

          cd "$GDE_DIR"
          echo "=== Contents of $GDE_DIR ==="
          ls -la

          if [ ! -f "SConstruct" ]; then
            echo "ERROR: SConstruct not found in $(pwd)"
            find . -name "SConstruct" || true
            exit 1
          fi

          # Ensure godot_cpp exists with the name the SConstruct expects
          if [ -d "godot-cpp" ] && [ ! -d "godot_cpp" ]; then
            mv godot-cpp godot_cpp
          fi
          if [ ! -d "godot_cpp" ]; then
            echo "Cloning godot-cpp as godot_cpp (required by SConstruct)..."
            git clone --depth 1 -b master https://github.com/godotengine/godot-cpp.git godot_cpp
            cd godot_cpp
            git submodule update --init --recursive
            cd ..
          fi

          # Patch SConstruct: remove "tls", inject extra library paths
          python3 << 'EOF'
          import os
          prefix = os.environ["GITHUB_WORKSPACE"] + "/codec_prefix/lib"
          with open("SConstruct", "r") as f:
              lines = f.readlines()
          with open("SConstruct", "w") as f:
              for line in lines:
                  for bad in ['"tls"', "'tls'"]:
                      line = line.replace(bad + ",", "")
                      line = line.replace(", " + bad, "")
                      line = line.replace(bad, '""')
                  if "env.SharedLibrary" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      f.write(f'{indent}env.Append(CPPPATH=["ffmpeg"])\n')
                      f.write(f'{indent}env.Append(LIBPATH=["ffmpeg/libavformat", "ffmpeg/libavcodec", "ffmpeg/libavutil", "ffmpeg/libswscale", "ffmpeg/libswresample", "{prefix}"])\n')
                      f.write(f'{indent}env.Append(LIBS=["avformat", "avcodec", "avutil", "swscale", "swresample", "vpx", "aom", "ssl", "crypto", "z"])\n')
                  f.write(line)
          EOF

          # Build
          scons platform=android target=template_release arch=arm64 -j$(nproc)
          scons platform=android target=template_debug   arch=arm64 -j$(nproc)

      # ------------------------------------------------------------------
      # 8. Locate binaries & patch .gdextension
      # ------------------------------------------------------------------
      - name: Patch GDExtension & copy binaries
        run: |
          set -euo pipefail

          EXT_FILE=$(find . -name "*.gdextension" | grep -v "core/gde_gozen" | head -n1)
          if [ -z "$EXT_FILE" ]; then
            echo "ERROR: Could not find main .gdextension file"
            exit 1
          fi
          EXT_DIR=$(dirname "$EXT_FILE")
          echo "Found extension: $EXT_FILE"

          mkdir -p "$EXT_DIR/bin"

          find ./core/gde_gozen -name "libgozen.android.template_release.arm64.so" -exec cp {} "$EXT_DIR/bin/" \;
          find ./core/gde_gozen -name "libgozen.android.template_debug.arm64.so"   -exec cp {} "$EXT_DIR/bin/" \;

          ls -la "$EXT_DIR/bin/"

          # Robustly inject library entries
          python3 << EOF
          import re
          path = "$EXT_FILE"
          with open(path) as f:
              content = f.read()

          content = re.sub(r'android\.(debug|release)\.arm64\s*=.*\n?', '', content)

          libs = '''[libraries]
          android.debug.arm64 = "res://addons/gde_gozen/bin/libgozen.android.template_debug.arm64.so"
          android.release.arm64 = "res://addons/gde_gozen/bin/libgozen.android.template_release.arm64.so"
          '''

          if "[libraries]" in content:
              content = content.replace("[libraries]", libs.strip(), 1)
          else:
              content += "\n" + libs

          with open(path, "w") as f:
              f.write(content)
          print("Patched", path)
          EOF

      # ------------------------------------------------------------------
      # 9. Create the final project ZIP
      # ------------------------------------------------------------------
      - name: Create project ZIP
        run: |
          set -euo pipefail
          mkdir -p dist

          zip -r dist/GoZen-Android-Project.zip . \
            -x "*.git*" \
            -x "*core/gde_gozen/libvpx*" \
            -x "*core/gde_gozen/libaom*" \
            -x "*core/gde_gozen/ffmpeg*" \
            -x "*core/gde_gozen/godot-cpp*" \
            -x "*codec_prefix*" \
            -x "*openssl*" \
            -x "*build*" \
            -x "*dist*" \
            -x "*.o" \
            -x "*.a" \
            -x "*.obj" \
            -x "*__pycache__*" \
            -x "*.pyc"

          echo "Created dist/GoZen-Android-Project.zip"
          ls -lh dist/

      # ------------------------------------------------------------------
      # 10. Upload artifact
      # ------------------------------------------------------------------
      - name: Upload Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-Android-Project
          path: dist/GoZen-Android-Project.zip
          retention-days: 14
