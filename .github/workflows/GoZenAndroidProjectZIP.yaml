name: Remote Build GoZen Android Project ZIP

on:
  workflow_dispatch:          # Manual trigger only

permissions:
  contents: read

jobs:
  build-project-zip:
    name: Build GoZen Android Project ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout (use the official mirrors; update if you move to Codeberg)
      # ------------------------------------------------------------------
      - name: Checkout GoZen
        uses: actions/checkout@v4
        with:
          repository: VoylinsGamedevJourney/gozen
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Toolchain setup
      # ------------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            ndk;23.2.8568313
            cmake;3.22.1

      - name: Setup Python + SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SCons
        run: pip install scons

      - name: Setup Godot 4.3 (with templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      # ------------------------------------------------------------------
      # 3. Cache heavy native builds
      # ------------------------------------------------------------------
      - name: Cache codec prefix + FFmpeg
        id: cache-codecs
        uses: actions/cache@v4
        with:
          path: |
            codec_prefix
            core/gde_gozen/ffmpeg
          key: codecs-arm64-${{ hashFiles('core/gde_gozen/**/SConstruct', 'core/gde_gozen/**/*.cpp') }}-v1

      # ------------------------------------------------------------------
      # 4. Build external codecs (only if cache miss)
      # ------------------------------------------------------------------
      - name: Build External Codecs (OpenSSL, VPX, AOM)
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          GDE_DIR="./core/gde_gozen"
          PREFIX="$GITHUB_WORKSPACE/codec_prefix"
          mkdir -p "$PREFIX"

          export ANDROID_NDK_ROOT="/usr/local/lib/android/sdk/ndk/23.2.8568313"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android24-clang
          export CXX=aarch64-linux-android24-clang++

          # ---------- OpenSSL ----------
          git clone --depth 1 -b openssl-3.0.12 https://github.com/openssl/openssl.git
          cd openssl
          ./Configure android-arm64 -D__ANDROID_API__=24 --prefix="$PREFIX" no-shared
          make -j$(nproc)
          make install_sw
          cd ..

          # ---------- libvpx ----------
          cd "$GDE_DIR/libvpx"
          ./configure \
            --target=arm64-android-gcc \
            --prefix="$PREFIX" \
            --disable-examples --disable-tools --disable-docs \
            --enable-pic --enable-static --disable-shared
          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

          # ---------- libaom ----------
          cd "$GDE_DIR/libaom"
          mkdir -p build_android && cd build_android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTS=0 -DENABLE_TOOLS=0 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------
      # 5. Cross-compile FFmpeg (shared, with the codecs)
      # ------------------------------------------------------------------
      - name: Cross-Compile FFmpeg (arm64)
        if: steps.cache-codecs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd ./core/gde_gozen/ffmpeg
          PREFIX="$GITHUB_WORKSPACE/codec_prefix"
          NDK_PATH="/usr/local/lib/android/sdk/ndk/23.2.8568313"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          API=24

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android$API-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android$API-clang++ \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --sysroot=$TOOLCHAIN/sysroot \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib" \
            --extra-libs="-lm -lz" \
            --prefix="$PREFIX" \
            --disable-programs \
            --disable-doc \
            --disable-static \
            --enable-shared \
            --enable-pic \
            --enable-libvpx \
            --enable-libaom \
            --enable-openssl \
            --enable-protocol=https \
            --enable-protocol=tls

          make -j$(nproc)
          make install
          cd "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------
      # 6. Compile the GDExtension
      # ------------------------------------------------------------------
      - name: Compile GDExtension (arm64)
        run: |
          set -euo pipefail
          cd ./core/gde_gozen

          # Safely patch SConstruct: remove "tls", inject paths
          python3 << 'EOF'
          import os
          prefix = os.environ["GITHUB_WORKSPACE"] + "/codec_prefix/lib"
          with open("SConstruct", "r") as f:
              lines = f.readlines()
          with open("SConstruct", "w") as f:
              for line in lines:
                  # Strip unsupported 'tls' library
                  for bad in ['"tls"', "'tls'"]:
                      line = line.replace(bad + ",", "")
                      line = line.replace(", " + bad, "")
                      line = line.replace(bad, '""')
                  if "env.SharedLibrary" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      f.write(f'{indent}env.Append(CPPPATH=["ffmpeg"])\n')
                      f.write(f'{indent}env.Append(LIBPATH=["ffmpeg/libavformat", "ffmpeg/libavcodec", "ffmpeg/libavutil", "ffmpeg/libswscale", "ffmpeg/libswresample", "{prefix}"])\n')
                      f.write(f'{indent}env.Append(LIBS=["avformat", "avcodec", "avutil", "swscale", "swresample", "vpx", "aom", "ssl", "crypto", "z"])\n')
                  f.write(line)
          EOF

          # Build
          scons platform=android target=template_release arch=arm64 -j$(nproc)

          # Also build a debug variant (useful for the editor)
          scons platform=android target=template_debug arch=arm64 -j$(nproc)

      # ------------------------------------------------------------------
      # 7. Locate binaries & patch .gdextension robustly
      # ------------------------------------------------------------------
      - name: Patch GDExtension & copy binaries
        run: |
          set -euo pipefail

          # Find the real .gdextension (ignore the test_room one)
          EXT_FILE=$(find . -name "*.gdextension" | grep -v "core/gde_gozen" | head -n1)
          if [ -z "$EXT_FILE" ]; then
            echo "ERROR: Could not find main .gdextension file"
            exit 1
          fi
          EXT_DIR=$(dirname "$EXT_FILE")
          echo "Found extension: $EXT_FILE"

          mkdir -p "$EXT_DIR/bin"

          # Copy both release and debug .so (search for them)
          find ./core/gde_gozen -name "libgozen.android.template_release.arm64.so" -exec cp {} "$EXT_DIR/bin/" \;
          find ./core/gde_gozen -name "libgozen.android.template_debug.arm64.so"   -exec cp {} "$EXT_DIR/bin/" \;

          # Make sure we actually have the binaries
          ls -la "$EXT_DIR/bin/"

          # Robustly inject the library entries (Python is safer than sed)
          python3 << EOF
          import re
          path = "$EXT_FILE"
          with open(path) as f:
              content = f.read()

          # Remove any existing android.* lines under [libraries]
          content = re.sub(r'android\.(debug|release)\.arm64\s*=.*\n?', '', content)

          libs = '''[libraries]
          android.debug.arm64 = "res://addons/gde_gozen/bin/libgozen.android.template_debug.arm64.so"
          android.release.arm64 = "res://addons/gde_gozen/bin/libgozen.android.template_release.arm64.so"
          '''

          if "[libraries]" in content:
              content = content.replace("[libraries]", libs.strip(), 1)
          else:
              content += "\n" + libs

          with open(path, "w") as f:
              f.write(content)
          print("Patched", path)
          EOF

      # ------------------------------------------------------------------
      # 8. Optional: create a minimal export_presets.cfg (handy if someone
      #    later wants to export an APK from the Android editor)
      # ------------------------------------------------------------------
      - name: Create helper export_presets.cfg
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/GoZen.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name=""
          package/unique_name="com.voylins.gozen"
          package/name="GoZen"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          gesture/swipe_to_dismiss=true
          screen/immersive_mode=true
