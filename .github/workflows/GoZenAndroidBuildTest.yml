name: Remote Build GoZen for Android

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-and-export:
    name: Build GoZen APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout External Repository
        uses: actions/checkout@v4
        with:
          repository: VoylinsGamedevJourney/gozen
          submodules: recursive # Fetches gde_gozen and other dependencies

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Setup Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install SCons
        run: pip install scons

      - name: Compile FFmpeg & GDExtension
        run: |
          # Dynamically locate the gde_gozen submodule directory
          GDE_DIR=$(find . -type d -name "gde_gozen" | head -n 1)
          
          if [ -z "$GDE_DIR" ]; then
            echo "Error: Could not find the gde_gozen submodule."
            exit 1
          fi
          
          echo "Found gde_gozen at: $GDE_DIR"
          cd "$GDE_DIR"
          
          # Compile the GDExtension for Android architectures
          scons platform=android target=template_release arch=arm64
          scons platform=android target=template_release arch=arm32
          
          # Return to the GitHub workspace root for the Godot export step
          cd $GITHUB_WORKSPACE

      - name: Inject Android Export Preset
        run: |
          # Since GoZen is primarily a desktop project, it likely lacks an Android export preset.
          # This dynamically generates a basic preset to allow headless exporting.
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          custom_template/debug=""
          custom_template/release=""
          EOF

      - name: Setup Godot Headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.2' # Adjust to match GoZen's required engine version
          use-dotnet: false
          include-templates: true

      - name: Export Android APK
        run: |
          mkdir -p build
          # Requires a valid debug keystore for exporting, which setup-android handles.
          godot --headless --export-release "Android" build/GoZen.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoZen-Android-APK
          path: build/GoZen.apk
